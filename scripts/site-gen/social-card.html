<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patrick Severs social preview source</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; padding: 48px 56px; background: #fff; color: #101010; font-family: Inter, Arial, sans-serif; }
    header { display: flex; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid #c8d1d9; font-size: 18px; font-weight: 700; }
    header span:last-child { color: #254e70; font-weight: 500; }
    main { display: grid; grid-template-columns: 1fr 250px; gap: 48px; margin-top: 40px; }
    .kicker { margin: 0 0 18px; color: #254e70; font-size: 14px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 64px; font-weight: 600; line-height: 1.06; letter-spacing: -.04em; }
    img { display: block; width: 250px; height: 312px; object-fit: cover; object-position: top; border: 1px solid #c8d1d9; }
    dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 36px 0 0; padding-top: 20px; border-top: 2px solid #101010; }
    dt { font-family: Georgia, serif; font-size: 34px; line-height: 1; letter-spacing: -.04em; }
    dd { margin: 10px 0 0; color: #454545; font-size: 14px; line-height: 1.4; }
  </style>
</head>
<body>
  <header><span>Patrick Severs / GTM</span><span>patricksevers.com</span></header>
  <main>
    <div>
      <p class="kicker">Enterprise sales &amp; AI adoption</p>
      <h1>I grow accounts.<br>I put AI to work.</h1>
      <dl>
        <div><dt>3,000</dt><dd>Box seats, expanded<br>from an initial 100</dd></div>
        <div><dt>176%</dt><dd>of quota at ADP<br>President's Club, 2018</dd></div>
        <div><dt>122%</dt><dd>G2i revenue growth<br>2024 to 2025</dd></div>
      </dl>
    </div>
    <img src="../../src/assets/images/portrait-riso.jpg" alt="Patrick Severs" width="250" height="312">
  </main>
</body>
</html>
